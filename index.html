<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    // tema oscuro por defecto; aplica la preferencia guardada antes de pintar
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; }
    catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Cambiar tema">☀️ Claro</button>
  <div class="wrapper">
    <h1 class="title">TETRIS</h1>

    <div class="game-area">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section records">
          <span class="label">RECORDS</span>
          <ol id="panel-records" class="records-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <b id="best-combo">0</b></span>
            <span>Líneas máx: <b id="max-lines">0</b></span>
          </div>
          <button id="reset-records-btn" type="button">Resetear records</button>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-records" class="hidden">
          <p id="overlay-record-msg"></p>
          <form id="name-form" class="hidden" autocomplete="off">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Nombre del jugador" />
            <button id="save-name-btn" type="submit">Guardar</button>
          </form>
          <ol id="overlay-records-list" class="records-list"></ol>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
